[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yomibench"
version = "0.1.0"
description = "Bots and a tournament arena for Your Only Move Is HUSTLE"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]
net = [
    "numpy>=2",
]
train = [
    "numpy>=2",
    "torch>=2.5",
]

[project.scripts]
yomibench = "yomibench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
