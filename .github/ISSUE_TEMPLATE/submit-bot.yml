name: Submit a bot to the Arena
description: Enter your trained nets (a model bundle) in the Arena's rated matches. Data only, no code.
title: "Arena submission: "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Phase 1 takes **data only**: a model bundle made with `yomibench bundle pack` (frozen nets, arrays only)
        and an entry with your bot's search settings for our existing search. Every bot plays under the same ranked
        settings and the same per-move thinking budget. See the submission guide (docs/SUBMIT.md).

        **The checks are live; rated matches open soon.** Valid bots are played once rated matches start.

        Check it first on your own PC: `python tools/validate_submission.py entry.json your-bot.zip`
  - type: input
    id: name
    attributes:
      label: Bot name
      description: The name inside your bundle (1-40 of a-z 0-9 . _ -). A new version needs a new name, like my-bot-2.
      placeholder: my-bot-1
    validations:
      required: true
  - type: textarea
    id: entry
    attributes:
      label: Entry
      description: Your entry. The owner must be your GitHub login. Settings may only narrow your bot's search (see the guide).
      render: json
      value: |
        {"name": "my-bot-1", "owner": "your-github-login", "bundle_sha256": "<sha256 of the zip>", "candidate_set": 6, "settings": {}}
    validations:
      required: true
  - type: textarea
    id: bundle
    attributes:
      label: Bundle
      description: Drag your bundle zip here (25 MB at most), or paste the link to a release asset on GitHub.
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Before you submit
      options:
        - label: The nets are my own work or I have the right to enter them, and they may be published with their results.
          required: true
        - label: The bundle holds nets only. No game files and no data from other players' replays.
          required: true
