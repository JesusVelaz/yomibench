# Build the site from every release's files (gen-N.json and its videos) and the Arena's data, and deploy it to
# GitHub Pages. Runs when Arena results, the site, the docs or this workflow change on main, and by hand. A published
# release (a promotion) starts a run on main: Pages serves only deployments from its source branch, so a deploy from
# the release's tag would succeed and never show. No video is ever committed to the repository: they live on the
# releases.
name: site
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ["arena/**", "site/**", "docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  redeploy:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Build and deploy from main (it downloads every release, this one included)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"
  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown==3.7
      - name: Download every release's files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p releases
          for tag in $(gh release list --limit 200 --json tagName -q '.[].tagName'); do
            gh release download "$tag" --dir releases --skip-existing
          done
      - name: Build the site (the project Pages URL is https://OWNER.github.io/REPO)
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: python site/build.py --releases releases --docs docs --arena arena --out _site --site-url "https://${OWNER,,}.github.io/$REPO"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
